[package]
name = "relay-direct"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-network transport for authenticated RelayPost parcels"

[dependencies]
anyhow = "1"
mdns-sd = { version = "=0.21.7", default-features = false, features = ["logging"] }
log = "0.4"
relay-core = { path = "../relay-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.14"

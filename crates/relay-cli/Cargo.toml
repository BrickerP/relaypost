[package]
name = "relay-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline file handoffs with signed receipts"

[[bin]]
name = "relaypost"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
directories = "6"
relay-core = { path = "../relay-core" }
rpassword = "7.4"
serde = "1"
serde_json = "1"
zeroize = "1.8"
